name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # SQLite file locking differs; invariant 1 runs on both
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.21
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: [python, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.21
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui e2e

  wheel:
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.21
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - run: uv build --wheel
      - name: wheel contains the UI
        run: python -c "import glob,sys,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); sys.exit(0 if 'flight_recorder/static/index.html' in z.namelist() else 'wheel has no UI')"
      - name: install into a fresh venv
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/flight-recorder --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flight-recorder:ci .
